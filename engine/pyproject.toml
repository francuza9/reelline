[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelline"
version = "0.1.0"
description = "Short-video channel engine: ingest, pick, script, render, QA, approve, publish."
requires-python = ">=3.12"
# The same set as requirements.txt, which pins exact versions and the CPU torch wheels
# (their extra index can't be written here); torch/torchaudio's "+cpu" local version satisfies
# the plain pins below.
dependencies = [
    "google-genai>=2.25.0,<3",
    "python-dotenv",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "uroman==1.3.1.1",
    "numpy==2.5.3",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "PyYAML==6.0.3",
    "lxml==6.1.3",
    "cssselect==1.5.0",
    "requests==2.34.2",
    "feedparser==6.0.14",
    "trafilatura==2.2.0",
    "Protego==0.7.0",
    "boto3==1.43.107",
    "pydantic==2.13.5",
]

[project.scripts]
reelline = "reelline.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic==1.10.0"]
google = ["google-genai>=2.25.0,<3"]
openai = []
all = ["reelline[anthropic,google,openai]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `from tests.test_x import ...` (tests share fixtures and fakes across files); scripts/ for `import render_reel` etc.,
# so a test module imports on its own, whatever ran before it
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["remotion", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-3: the Georgian and typographic characters in strings are the point. RUF005/007/012/043/059 are
# style-only (list concatenation, pairwise, ClassVar on test doubles, regex-in-raises, unused unpacks).
# E501: `ruff format` owns code line length (120); what is left is 43 lines that cannot be wrapped without changing
# them (prompt and SQL strings, JS in test strings, Georgian text, module docstrings) -- the formatter's own advice.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF005", "RUF007", "RUF012", "RUF043", "RUF059"]

[tool.mypy]
python_version = "3.12"
# `mypy` alone checks the strict set (hard in CI); `mypy --follow-imports=normal src/reelline` the whole package.
files = [
    "src/reelline/config", "src/reelline/core",
    "src/reelline/pipeline/runner.py", "src/reelline/pipeline/step.py", "src/reelline/pipeline/chain.py",
    "src/reelline/providers/base.py", "src/reelline/providers/registry.py",
    "src/reelline/notify/base.py", "src/reelline/notify/registry.py",
    "src/reelline/review/base.py", "src/reelline/review/registry.py",
    "src/reelline/publish/base.py", "src/reelline/publish/registry.py",
    "src/reelline/stats/base.py", "src/reelline/stats/registry.py",
    "src/reelline/storage/blob.py", "src/reelline/storage/registry.py",
    "src/reelline/render/base.py", "src/reelline/render/registry.py",
]
follow_imports = "silent"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# The rest of the package is checked at mypy's default strength; the modules below are `--strict`
# (every flag of it, per module: CI fails on any error in them).

[[tool.mypy.overrides]]
module = [
    "reelline.config", "reelline.config.*", "reelline.core", "reelline.core.*",
    "reelline.pipeline.runner", "reelline.pipeline.step", "reelline.pipeline.chain",
    "reelline.providers.base", "reelline.providers.registry",
    "reelline.notify.base", "reelline.notify.registry",
    "reelline.review.base", "reelline.review.registry",
    "reelline.publish.base", "reelline.publish.registry",
    "reelline.stats.base", "reelline.stats.registry",
    "reelline.storage.blob", "reelline.storage.registry",
    "reelline.render.base", "reelline.render.registry",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
